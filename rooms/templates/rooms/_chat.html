{% comment %}Chat buttons (only the ones the admin filled in under Manage > Costs & chat).{% endcomment %}
{% if chat_links %}<div class="chat-row" role="group" aria-label="Chat with us">
  {% for c in chat_links %}<a class="chat-btn chat-{{ c.key }}" href="{{ c.url }}" {% if c.key != 'viber' %}target="_blank" rel="noopener"{% endif %}>
    {% if c.key == 'whatsapp' %}<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a9.9 9.9 0 0 0-8.5 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.700 6.700 0 0 1-3.300-2.900c-.2-.4.2-.4.700-1.300.1-.2 0-.3 0-.5l-.8-1.800c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.200 5.200 5.200 0 0 0 1.100 2.800 11.900 11.900 0 0 0 4.600 4.100c1.700.7 2.400.8 3.200.7.500-.1 1.500-.6 1.700-1.200.2-.6.2-1.100.2-1.200-.1-.1-.3-.2-.5-.3z"/></svg>
    {% elif c.key == 'viber' %}<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12.100 2C7.300 2 4 2.700 2.700 6.900c-.6 2-.5 5.300.1 7.400.6 2 2 3.100 3.700 3.400v3.300c0 .4.5.600.8.300l2.800-3.300c1 .1 2.100.1 3 .1 4.800 0 8.100-.7 9.400-4.900.6-2 .5-5.300-.1-7.400C20.500 3 17 2 12.100 2zm5.100 13.400c-.3.800-1 1.300-1.700 1.600-.2.100-.5 0-.7 0-1.900-.7-3.600-1.800-5-3.200a14 14 0 0 1-2.400-3.400c-.2-.4-.4-.9-.5-1.300 0-.7.300-1.300 1-1.700.4-.2.700-.2 1 .2l.9 1.300c.2.300.2.600-.1.900l-.4.400c-.1.100-.2.300-.1.400a8 8 0 0 0 3 3c.2.100.3.100.5-.1l.6-.6c.3-.2.600-.2.900 0l1.300.9c.3.200.4.500.2.800z"/></svg>
    {% else %}<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2C6.400 2 2 6.200 2 11.500c0 2.900 1.300 5.500 3.500 7.200V22l3.200-1.800c1 .3 2.100.4 3.300.4 5.600 0 10-4.200 10-9.500S17.600 2 12 2zm1 12.800-2.500-2.700-4.900 2.700 5.400-5.700 2.600 2.700 4.800-2.700-5.400 5.700z"/></svg>{% endif %}
    <span>{{ c.label }}</span></a>{% endfor %}
</div>{% endif %}
